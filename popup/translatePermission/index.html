<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FunPay Lite Bot</title>
    <style>
        /* Light theme defaults. Dark theme variables override via
           [data-theme="dark"] on <html>, set by index.ts from the
           ?theme= URL param the content script passes. Values are
           lifted from src/content/static/style.css's --lb-surface-*
           tokens so the consent card matches what the project's
           own confirmModal / featureGatedModal would render in the
           same theme. */
        /* The dialog lives in a chrome-extension:// iframe, so FunPay's
           Bootstrap CSS isn't available here, we replicate the native
           .btn-primary / .btn-default look with these tokens. Light
           values mirror FunPay's default skin; dark mirrors the
           extension's dark theme (themes/dark.css .btn-primary). */
        :root {
            --surface: #fff;
            --surface-text: #333;
            --surface-muted: #666;
            --surface-border: #ddd;
            --surface-shadow: rgba(0, 0, 0, 0.2);
            --hover-tint: rgba(0, 0, 0, 0.05);
            /* FunPay primary blue (Bootstrap 3 default skin). */
            --primary-bg: #337ab7;
            --primary-border: #2e6da4;
            --primary-text: #fff;
            /* btn-default (light): white face, grey border. */
            --default-bg: #fff;
            --default-border: #ccc;
            --default-text: #333;
        }
        :root[data-theme="dark"] {
            --surface: #1e1e1e;
            --surface-text: #e8e6e3;
            --surface-muted: #b2aba1;
            --surface-border: rgba(255, 255, 255, 0.12);
            --surface-shadow: rgba(0, 0, 0, 0.6);
            --hover-tint: rgba(255, 255, 255, 0.06);
            /* Mirrors themes/dark.css .btn-primary. */
            --primary-bg: #265c9a;
            --primary-border: #23528a;
            --primary-text: #e8e6e3;
            --default-bg: #2b2b2b;
            --default-border: rgba(255, 255, 255, 0.18);
            --default-text: #e8e6e3;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: var(--font, system-ui), -apple-system, "Segoe UI", sans-serif;
            color: var(--surface-text);
        }
        .modal {
            background: var(--surface);
            border-radius: var(--surface-radius, 8px);
            padding: 24px;
            box-shadow: 0 10px 40px var(--surface-shadow);
            position: relative;
        }
        .close {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: 0;
            background: transparent;
            color: var(--surface-muted);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            border-radius: 4px;
            padding: 0;
        }
        .close:hover { color: var(--surface-text); background: var(--hover-tint); }
        .title {
            margin: 0 0 16px;
            padding-right: 28px;
            font-size: 18px;
            font-weight: 600;
            color: var(--surface-text);
            line-height: 1.3;
        }
        .body {
            margin: 0 0 20px;
            font-size: 14px;
            color: var(--surface-muted);
            line-height: 1.45;
        }
        .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        /* Replicate FunPay's native Bootstrap .btn sizing. */
        .actions button {
            padding: 6px 12px;
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            min-width: 90px;
            font-family: inherit;
            line-height: 1.42857143;
        }
        /* .btn-default look. */
        .cancel {
            background: var(--default-bg);
            color: var(--default-text);
            border-color: var(--default-border);
        }
        /* Hover via brightness so it works for ANY sampled theme color
           (FLB-31), no per-theme hover variants needed. */
        .cancel:hover { filter: brightness(0.93); }
        /* .btn-primary look: solid FunPay blue, no gradient. */
        .primary {
            background: var(--primary-bg);
            color: var(--primary-text);
            border-color: var(--primary-border);
        }
        .primary:hover { filter: brightness(0.93); }
    </style>
</head>
<body>
    <div class="modal">
        <button class="close" id="close" type="button" aria-label="Close">×</button>
        <h3 class="title" data-i18n="lotTranslateConsentTitle">Разрешение на перевод</h3>
        <p class="body" data-i18n="lotTranslateConsentBody">Для перевода названий и описаний лотов на английский расширению нужен разовый доступ к translate.googleapis.com.</p>
        <div class="actions">
            <button class="cancel" id="cancel" type="button" data-i18n="lotTranslateConsentCancel">Отмена</button>
            <button class="primary" id="grant" type="button" data-i18n="lotTranslateConsentGrant">Разрешить</button>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
